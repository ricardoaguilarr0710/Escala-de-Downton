#include <iostream>
#include <string>
using namespace std;

// Estructura para guardar los parámetros de la escala
struct DowntonInput {
    int respuestaVerbal;   // 0 a 2
    int respuestaMotora;   // 0 a 2
    int respiracion;       // 0 a 2
    int tonoMuscular;      // 0 a 2
    int conciencia;        // 0 a 2
};

// Función para validar rango
bool validarRango(int valor) {
    return valor >= 0 && valor <= 2;
}

// Función principal de cálculo
int calcularEscalaDownton(const DowntonInput& dato) {
    return dato.respuestaVerbal +
           dato.respuestaMotora +
           dato.respiracion +
           dato.tonoMuscular +
           dato.consciencia;
}

// Clasificación del resultado
string clasificar(int puntaje) {
    if (puntaje >= 8) {
        return "Estado estable / sin riesgo importante";
    } else if (puntaje >= 5) {
        return "Observación / vigilancia moderada";
    } else if (puntaje >= 3) {
        return "Riesgo clínico significativo";
    } else {
        return "Se requiere evaluación médica urgente";
    }
}

int main() {
    DowntonInput datos;

    cout << "=== ESCALA DOWNTON ===" << endl;
    cout << "Ingrese valores del 0 al 2 para cada criterio." << endl;

    cout << "Respuesta verbal (0-2): ";
    cin >> datos.respuestaVerbal;
    if (!validarRango(datos.respuestaVerbal)) {
        cout << "Valor fuera de rango." << endl;
        return 1;
    }

    cout << "Respuesta motora (0-2): ";
    cin >> datos.respuestaMotora;
    if (!validarRango(datos.respuestaMotora)) {
        cout << "Valor fuera de rango." << endl;
        return 1;
    }

    cout << "Respiracion (0-2): ";
    cin >> datos.respiracion;
    if (!validarRango(datos.respiracion)) {
        cout << "Valor fuera de rango." << endl;
        return 1;
    }

    cout << "Tono muscular (0-2): ";
    cin >> datos.tonoMuscular;
    if (!validarRango(datos.tonoMuscular)) {
        cout << "Valor fuera de rango." << endl;
        return 1;
    }

    cout << "Conciencia (0-2): ";
    cin >> datos.consciencia;
    if (!validarRango(datos.consciencia)) {
        cout << "Valor fuera de rango." << endl;
        return 1;
    }

    int total = calcularEscalaDownton(datos);
    string resultado = clasificar(total);

    cout << "\n=== RESULTADO ===" << endl;
    cout << "Puntuacion total: " << total << endl;
    cout << "Clasificacion: " << resultado << endl;

    return 0;
}
